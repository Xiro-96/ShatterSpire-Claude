name: Tests

# Etage 0 der Roadmap: die EditMode-Tests laufen bei jedem Push,
# damit ein Refactoring in Etage 1 nicht unbemerkt Balance-Logik
# oder die Save-Migration zerlegt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Ohne Unity-Lizenz kann game-ci den Editor nicht starten. Die
      # Fehlermeldung von Unity ist dabei sehr unklar, deshalb hier
      # ein sauberer Abbruch mit Anleitung.
      - name: Unity-Zugangsdaten prüfen
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Unity-Secrets fehlen. Unter Settings > Secrets and variables > Actions anlegen: UNITY_EMAIL, UNITY_PASSWORD und UNITY_LICENSE (der Inhalt der .ulf-Datei, bei Windows unter C:\\ProgramData\\Unity\\Unity_lic.ulf)."
            exit 1
          fi

      # Ein kalter Unity-Import dauert mehrere Minuten. Der Cache macht
      # aus jedem Folgelauf eine Sache von unter einer Minute.
      - name: Library cachen
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: EditMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          # unityVersion wird aus ProjectSettings/ProjectVersion.txt gelesen
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Ergebnisse

      - name: Ergebnisse hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
